# Kopiere diese Datei nach config/settings.toml und passe sie an.
# settings.toml bleibt lokal und landet nicht im Repo.

[paths]
data_dir = "G:/clipped-data"

[clips]
min_seconds = 20
max_seconds = 60
candidates_per_vod = 35
language = "en"

[transcribe]
model = "large-v3"
compute_type = "int8_float16"
device = "cuda"

[llm]
host = "http://127.0.0.1:11434"
model = "gemma4:e4b"

[render]
width = 1080
height = 1920
fps = 30
video_encoder = "h264_nvenc"
target_lufs = -14.0

[style]
highlight_color = "#FFE500"
subtitle_size = 148

[branding]
watermark = "@deinhandle"
endcard_title = "MORE GTA 6 CLIPS"
endcard_seconds = 2.5

[[branding.channels]]
platform = "tiktok"
handle = "@deinhandle"

[[branding.channels]]
platform = "youtube"
handle = "@deinhandle"

[[branding.channels]]
platform = "instagram"
handle = "@deinhandle"
