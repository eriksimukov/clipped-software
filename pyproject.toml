[project]
name = "clipped"
version = "0.1.0"
description = "Lokaler Generator fuer GTA-6-Clips aus Streamer-VODs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.28.0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
clipped = "clipped.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipped"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
